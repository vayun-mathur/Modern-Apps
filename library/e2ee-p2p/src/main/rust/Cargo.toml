[package]
name = "e2ee_pqc"
version = "0.1.0"
edition = "2021"
description = "ML-KEM-768 + ML-DSA-65 for the e2ee-p2p library (FIPS 203/204, RustCrypto-adjacent), DER-compatible with the previous Bouncy Castle encoding, exposed to Kotlin via JNI."
license = "GPL-2.0-only"

[lib]
name = "e2ee_pqc"
crate-type = ["cdylib", "rlib"]

[dependencies]
fips203.workspace = true
fips204.workspace = true
sha2.workspace = true
sha3.workspace = true
shake.workspace = true
jni.workspace = true
rand.workspace = true
rand_core.workspace = true
