# `tilecodec` is a workspace root of its own, because it is consumed both by this
# workspace's `map_renderer` cdylib and by the detached host tool
# `scripts/maps/tile_build`. It lives inside this tree, so it has to be excluded
# explicitly or cargo reports "multiple workspace roots found in the same workspace"
# as soon as a member depends on it.
# `personal/uniflix` is likewise a workspace root of its own (see its
# Cargo.toml), for a different reason: it lives under gitignored personal/ and
# may not exist in a given checkout, and cargo has no conditional members — a
# missing member fails resolution of the whole workspace. Excluded entries may
# match nothing, so this keeps the root workspace resolvable with and without
# personal/ present.
exclude = ["library/tilecodec/src/main/rust", "personal/uniflix/src/main/rust"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.lints.rust]
missing_docs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_results = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(rust_analyzer)', 'cfg(blaze)'] }
# Lint sweep (warn-then-error): rustdoc link/tag hygiene lands as warnings
# first, promotes to deny with the rest of the comment sweep at promotion.
# (Table is `workspace.lints.rustdoc`, not dotted keys under `rust` — cargo
# rejects `lints.rust.rustdoc::X` as an invalid lint name.)
[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
invalid_html_tags = "warn"

[workspace.lints.clippy]
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
# Lint sweep (warn-then-error): catches TODO!/unimplemented!/dbg! left in the
# tree plus doc-comment drift; promotes to deny at promotion.
todo = "warn"
dbg_macro = "warn"
empty_line_after_doc_comments = "warn"
doc_markdown = "warn"
# Lint sweep: conservative warn set. missing_panics_doc keeps `# Panics`
# sections honest on public fns; needless_borrow and len_without_is_empty are
# mechanical. All promote to deny at promotion once the inheriting slices are
# green. Existing deny set above is unchanged.
missing_panics_doc = "warn"
needless_borrow = "warn"
len_without_is_empty = "warn"

# Centralized Rust versions – armv8-only (aarch64-linux-android)

[workspace.dependencies]
# Upstream jni from crates.io, not a vendored fork.
#
# 0.22 API: native methods now receive `EnvUnowned` and must adapt it via
# `with_env` plus an `ErrorPolicy`; `GlobalRef`/`AutoLocal` renamed. All 31
# native entry points migrated in this bump.
jni = "0.22.4"
jni-sys = "0.3.1"
cesu8 = "1.1.0"
thiserror = { version = "2" }
log = "0.4.34"
cfg-if = "1.0.5"

serde = { version = "1.0.229", features = ["derive"] }
serde_core = "1.0.229"
proc-macro2 = "1.0.92"
quote = "1.0.40"
syn = "3.0.9"
itoa = "1.0.15"
memchr = "2.8.3"
# XML pull parsing for the OOXML/ODF importers. Only transitive dep is memchr, pinned above.
quick-xml = { version = "0.42", default-features = false }
serde_json = "1.0.154"

# Brave Shields engine (:web). default-features off drops `single-thread` so `Engine` is
# Send + Sync, which the WebView render thread requires.
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

# Imaging – image crate 0.25->moxcms/pxfm removed, use tiny jpeg-encoder/decoder (1 function per your rule)
jpeg-decoder = { version = "0.3.2", default-features = false }
jpeg-encoder = { version = "0.7.1", default-features = false }
flate2 = "1.1.10"

# Crypto / PQC (features preserved – no feature loss)
sha2 = { version = "0.11.1", features = ["oid"] }
# SHAKE256 for FindFamily link-seed expansion. Already in the lock file transitively
# via fips203/fips204, so this only promotes it to a direct dependency.
sha3 = "0.12"
shake = "0.1"
aes = "0.9.3"
# `aes09` kept for the keepass dual-stack rationale: keepass 0.15.x needs aes
# 0.9.x (cipher 0.5 stack). Now redundant with the default `aes` 0.9.3 pin but
# retained so `aes09.workspace` edges in passwords keep resolving.
aes09 = { package = "aes", version = "=0.9.3" }
md-5 = "0.11.0"
# keepass 0.15.x (cipher 0.5 / cbc 0.2 / aes 0.9 stack, matching the workspace
# default aes 0.9.3 pin). Only passwords uses keepass.
keepass = { version = "=0.15.2", default-features = false, features = ["save_kdbx4"] }
# Classic Signal protocol (WhatsApp bridge) – X25519/XEdDSA + AES-CBC + HMAC.
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
# MLS (RFC 9420) for the RCS line — OpenMLS + RustCrypto provider + memory storage.
openmls = { version = "0.9.1", default-features = false }
openmls_rust_crypto = "0.6.0"
openmls_memory_storage = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
tls_codec = "0.5.0"
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets"] }
hmac = "0.13.0"
subtle = "2.6.1"
fips203 = "0.4.3"
fips204 = "0.4.6"
rand_core = { version = "0.10.1" }
rand = { version = "0.10.3", default-features = true }
getrandom = "0.4.3"
# x509-cert / cms / spki / rsa removed with the PDF signature-creation feature.
der = { version = "0.8.2", features = ["alloc", "oid"] }
const-oid = { version = "0.9.6", features = ["db"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "glyph-names"] }
# weezl, cbc removed – std LZW + own CBC in pdf_cbc.rs (single function, prefer stdlib)
fax = "0.3.0"
hayro = "0.8.0"
hayro-jbig2 = { version = "0.3.0", default-features = false, features = ["std"] }
openjp2 = "0.6.1"
lopdf = { version = "0.45", default-features = false, features = ["serde"] }
libc = "0.2.190"
indexmap = { version = "2.14.2" }
hashbrown = "0.14.5"
byteorder = "1.5.0"
smallvec = "1.14.0"

# No HTTP client crate anywhere: Rust reaches the network through library:network via
# the flat-framed JNI bridge in library/jni-http, so no .so links its own TLS.
# omfiles / memmap2 / ndarray removed – weather uses its own sync src/om.rs on top of
# the vendored om-file-format-sys C lib (see weather/src/main/rust/Cargo.toml).

# Build. `cc = "1"` (not 1.8): tree-sitter-javascript's build-dep requires
# `cc ~1.0.90` (<1.1.0), so the single workspace lockfile resolves cc to the
# newest 1.0.x for everyone including om-file-format-sys.
cc = { version = "1" }

# Minimal platform
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1.64"
crossbeam-utils = "0.8.21"
crossbeam-epoch = "0.9.18"
crossbeam-deque = "0.8.6"
either = "1.19.0"
rayon = "1.11.0"
rayon-core = "1.13.0"
# nalgebra removed – camera now uses its own src/linalg.rs (see camera Cargo.toml)


