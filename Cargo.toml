rand_chacha = { version = "0.10.0", default-features = false }
xts-mode = "0.6.0"
wycheproof = "0.7.0"
blake2 = "0.11.0"
hdrhistogram = "7.6.0"
regex = "1.13.1"
criterion = { version = "0.8.2", features = ["html_reports"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
num-bigint = "0.5.1"
bytes = "1.12.1"
hex-literal = "1.1.0"
prost = "0.14"
