hex = "0.4.3"
rand_pcg = "0.10.2"
base64 = "0.23.1"
ctr = "0.10.1"
cbc = { version = "0.2.1", features = ["block-padding"] }
hkdf = "0.13.0"
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
aes-gcm-siv = { version = "0.12.1", features = ["aes"], default-features = false }
aead = "0.6.1"
cipher = "0.5"
chacha20poly1305 = "0.11.0"
protobuf = "=3.7.2"
protobuf-codegen = "=3.7.2"
sec1 = "0.8.1"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["rand_core"] }
ed25519 = "2.2.3"
