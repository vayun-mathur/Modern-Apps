[workspace]
members = [
  "astronomy/src/main/rust",
  "photos/src/main/rust",
  "office/src/main/rust",
  "weather/src/main/rust",
  "pdf/src/main/rust",
  "camera/src/main/rust",
  "maps/src/main/rust",
  "networklocation/src/main/rust",
  "euicc/src/main/rust",
  "passwords/src/main/rust",
  "appstore/src/main/rust",
  "vpn/src/main/rust",
  "library/e2ee-p2p/src/main/rust",
  "library/jni-http/src/main/rust",
  "library/map/src/main/rust",
  "library/ml/src/main/rust",
  "library/vision/src/main/rust",
  "measure/src/main/rust",
  "communicate/src/main/rust",
  "youpipe/src/main/rust",
  "web/src/main/rust",
  "share/src/main/rust",
  "third_party/om-file-format-sys",
  "third_party/betocore/array_view",
  "third_party/betocore/array_ref",
  "third_party/betocore/sink",
  "third_party/betocore/ldt_tbc",
  "third_party/betocore/xts_aes",
  "third_party/betocore/ldt",
  "third_party/betocore/np_hkdf",
  "third_party/betocore/ldt_np_adv",
  "third_party/betocore/np_adv",
  "third_party/betocore/rand_ext",
  "third_party/betocore/test_helper",
  "third_party/betocore/test_vector_hkdf",
  "third_party/betocore/crypto_provider",
  "third_party/betocore/crypto_provider_rustcrypto",
  "third_party/betocore/crypto_provider_default",
  "third_party/betocore/ukey2_rs",
  "third_party/betocore/ukey2_proto",
  "third_party/betocore/ukey2_connections",
]
# `tilecodec` is a workspace root of its own, because it is consumed both by this
# workspace's `map_renderer` cdylib and by the detached host tool
# `scripts/maps/tile_build`. It lives inside this tree, so it has to be excluded
# explicitly or cargo reports "multiple workspace roots found in the same workspace"
# as soon as a member depends on it.
exclude = ["library/tilecodec/src/main/rust"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.lints.rust]
missing_docs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_results = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(rust_analyzer)', 'cfg(blaze)'] }

[workspace.lints.clippy]
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"

# Centralized Rust versions – armv8-only (aarch64-linux-android)

[workspace.dependencies]
# Upstream jni from crates.io, not a vendored fork.
#
# This was a local fork (third_party/jni-android) of 0.21.1 that trimmed the
# dependency tree: it hand-wrote the JNI signature parser to drop `combine`
# (and transitively `bytes`), dropped the `walkdir` build-dep and `windows-sys`,
# and moved to thiserror 2. That saved a handful of crates at the cost of
# carrying ~20 vendored files that had to be kept in sync with upstream by hand
# - and 0.21.1 is from March 2023, so it had drifted three years behind.
#
# 0.22 is the current release but is a substantial API change (native methods
# now receive `EnvUnowned` and must adapt it via `with_env` plus an
# `ErrorPolicy`, and `GlobalRef`/`AutoLocal` were renamed). That migration
# touches all 31 native entry points across maps and games/voxels and needs an
# Android build to verify, so it is deliberately left as a follow-up.
jni = "0.21.1"
jni-sys = "0.3.1"
cesu8 = "1.1.0"
thiserror = { version = "2" }
log = "0.4.33"
cfg-if = "1.0.4"

serde = { version = "1.0.228", features = ["derive"] }
serde_core = "1.0.228"
proc-macro2 = "1.0.92"
quote = "1.0.40"
syn = "2.0.101"
itoa = "1.0.15"
memchr = "2.8.3"
# XML pull parsing for the OOXML/ODF importers. Only transitive dep is memchr, pinned above.
quick-xml = { version = "0.37", default-features = false }
serde_json = "1.0.149"

# Brave Shields engine (:web). default-features off drops `single-thread` so `Engine` is
# Send + Sync, which the WebView render thread requires.
adblock = { version = "0.13.2", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

# Imaging – image crate 0.25->moxcms/pxfm removed, use tiny jpeg-encoder/decoder (1 function per your rule)
jpeg-decoder = { version = "0.3.2", default-features = false }
jpeg-encoder = { version = "0.6.1", default-features = false }
flate2 = "1.1.4"

# Crypto / PQC (features preserved – no feature loss)
sha2 = { version = "0.11.0", features = ["oid"] }
# SHAKE256 for FindFamily link-seed expansion. Already in the lock file transitively
# via fips203/fips204, so this only promotes it to a direct dependency.
sha3 = "0.10"
aes = "0.8.4"
md-5 = "0.10.6"
keepass = { version = "0.13.17", default-features = false, features = ["save_kdbx4"] }
# Classic Signal protocol (WhatsApp bridge) – X25519/XEdDSA + AES-CBC + HMAC.
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
hmac = "0.12.1"
subtle = "2.6.1"
fips203 = "0.4.3"
fips204 = "0.4.6"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rand = "0.8.5"
getrandom = "0.2.15"
# x509-cert / cms / spki / rsa removed with the PDF signature-creation feature.
der = { version = "0.7.10", features = ["alloc", "oid"] }
const-oid = { version = "0.9.6", features = ["db"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "glyph-names"] }
# weezl, cbc removed – std LZW + own CBC in pdf_cbc.rs (single function, prefer stdlib)
fax = "0.3.0"
hayro-jbig2 = { version = "0.3.0", default-features = false, features = ["std"] }
openjp2 = "0.6.1"
lopdf = { version = "0.36", default-features = false, features = ["serde"] }
libc = "0.2.171"
indexmap = { version = "2.10.0" }
hashbrown = "0.14.5"
byteorder = "1.5.0"
smallvec = "1.14.0"

# No HTTP client crate anywhere: Rust reaches the network through library:network via
# the flat-framed JNI bridge in library/jni-http, so no .so links its own TLS.
# omfiles / memmap2 / ndarray removed – weather uses its own sync src/om.rs on top of
# the vendored om-file-format-sys C lib (see weather/src/main/rust/Cargo.toml).

# Build
cc = { version = "1.2.8" }

# Minimal platform
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1.64"
crossbeam-utils = "0.8.21"
crossbeam-epoch = "0.9.18"
crossbeam-deque = "0.8.6"
either = "1.13.0"
rayon = "1.11.0"
rayon-core = "1.13.0"
# nalgebra removed – camera now uses its own src/linalg.rs (see camera Cargo.toml)


# --- BetoCore vendored crates (third_party/betocore) — Apache-2.0 ---
# Local path crates (so `xxx.workspace = true` in vendored Cargo.tomls resolves)
array_view = { path = "third_party/betocore/array_view" }
array_ref = { path = "third_party/betocore/array_ref" }
sink = { path = "third_party/betocore/sink" }
ldt_tbc = { path = "third_party/betocore/ldt_tbc" }
xts_aes = { path = "third_party/betocore/xts_aes" }
ldt = { path = "third_party/betocore/ldt" }
np_hkdf = { path = "third_party/betocore/np_hkdf" }
ldt_np_adv = { path = "third_party/betocore/ldt_np_adv" }
np_adv = { path = "third_party/betocore/np_adv" }
rand_ext = { path = "third_party/betocore/rand_ext" }
test_helper = { path = "third_party/betocore/test_helper" }
test_vector_hkdf = { path = "third_party/betocore/test_vector_hkdf" }
crypto_provider = { path = "third_party/betocore/crypto_provider", default-features = false }
crypto_provider_default = { path = "third_party/betocore/crypto_provider_default", default-features = false }
crypto_provider_rustcrypto = { path = "third_party/betocore/crypto_provider_rustcrypto" }
ukey2_rs = { path = "third_party/betocore/ukey2_rs" }
ukey2_proto = { path = "third_party/betocore/ukey2_proto" }
ukey2_connections = { path = "third_party/betocore/ukey2_connections" }
# crates.io deps required by vendored betocore crates (pins from nearby/Cargo.toml)
tinyvec = { version = "1.6.0", features = ["rustc_1_55"] }
nom = { version = "7.1.3", default-features = false }
strum = { version = "0.27.1", default-features = false }
strum_macros = { version = "0.27.1", default-features = false }
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
itertools = { version = "0.13.0", default-features = false }
hex = "0.4.3"
rand_pcg = "0.3.1"
base64 = "0.22.1"
ctr = "0.9.2"
cbc = { version = "0.1.2", features = ["block-padding"] }
hkdf = "0.12.3"
aes-gcm = "0.10.3"
aes-gcm-siv = { version = "0.11.1", features = ["aes"], default-features = false }
aead = "0.5.1"
protobuf = "=3.7.2"
protobuf-codegen = "=3.7.2"
sec1 = "0.7.3"
ed25519-dalek = { version = "2.1.0", default-features = false }
ed25519 = "2.2.3"
p256 = { version = "0.13.2", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false }
xts-mode = "0.5.1"
wycheproof = "0.5.1"
blake2 = "0.10.6"
hdrhistogram = "7.5.4"
regex = "1.10.2"
criterion = { version = "0.5.1", features = ["html_reports"] }
clap = { version = "4.5.13", features = ["derive"] }
anyhow = "1.0.75"
num-bigint = "0.4.4"
bytes = "1.7.1"
hex-literal = "0.4.1"
# keep existing pins for sha2/aes/hmac/subtle/x25519-dalek/rand etc — betocore uses compatible versions

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
