constant_time_eq = "0.6.1"
typed-builder = "0.23.2"
bitfield-struct = "0.13.0"
duplicate = "2.0.1"
eyre = "0.6.14"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
ruzstd = "0.9"
diff = "0.1.13"
