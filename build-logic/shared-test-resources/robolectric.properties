# Repo-wide Robolectric default SDK (applied by common-conventions-app/library, which add
# this directory to every module's unit-test resources).
#
# The existing Robolectric tests pin `@Config(sdk = [34])` explicitly. This file sets that
# same SDK as the default for every test class WITHOUT an explicit `@Config(sdk = ...)`
# (mechanism, verified against robolectric-4.17: Robolectric merges the classpath-root
# robolectric.properties via Config$Implementation.fromProperties as the base config for
# every test, still overridable per test class with @Config). Keeps new tests on the same
# validated sandbox instead of whatever the module's targetSdk resolves to.
sdk=34
