name: "🚀 Publish Next Release"

on:
  workflow_dispatch:

# Only the non-secret keystore filename is workflow-scoped. The signing secrets are
# scoped to the single step that consumes them so they are not in the environment of
# third-party actions.
env:
  ks_filename: release_keystore.jks

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Set Up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Clean Project Files
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "Removing local includeBuild from settings.gradle.kts..."
            sed -i '/includeBuild.*NewPipeExtractor/,/^}/d' settings.gradle.kts
          fi

          if [ -f "build.gradle.kts" ]; then
            echo "Removing debug signingConfig from root build.gradle.kts..."
            sed -i '/signingConfig = signingConfigs.getByName("debug")/d' build.gradle.kts
          fi

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > ${{ env.ks_filename }}

      - name: Change Gradle Wrapper Permissions
        run: chmod +x ./gradlew

      - name: Configure Gradle for CI runner
        run: |
          # GitHub-hosted Linux runners are ~16GB RAM / ~4 vCPU. The project's
          # local gradle.properties sizes the daemon at -Xmx46g for a full local
          # build of every module at once, which cannot start on a runner.
          # GRADLE_USER_HOME (~/.gradle)/gradle.properties overrides the project
          # gradle.properties, so cap heap + workers to runner-appropriate values
          # here rather than changing the local dev defaults.
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8'
            echo 'org.gradle.workers.max=2'
            echo 'kotlin.daemon.jvm.options=-Xmx2048m'
            echo 'android.compose.screenshot.maxHeapSize=2g'
          } >> ~/.gradle/gradle.properties
          echo "CI gradle overrides:" && cat ~/.gradle/gradle.properties

      # First thing the release actually checks. The store listings under metadata_data/ are
      # consumed by "Prepare F-Droid Metadata" below, and a malformed one only shows up as a
      # rejected listing at publish time, so fail here instead - before anything is built.
      - name: Check Store Metadata
        run: ./gradlew checkMetadata --console=plain

      - name: Read and Inject Version
        id: version_info
        run: |
          VERSION_FILE="version.txt"
          if [ ! -f "$VERSION_FILE" ]; then
            echo "Error: $VERSION_FILE not found!"
            exit 1
          fi

          VERSION_CODE=$(sed -n '1p' "$VERSION_FILE" | tr -d '\r' | xargs)
          VERSION_NAME=$(sed -n '2p' "$VERSION_FILE" | tr -d '\r' | xargs)

          echo "Using Version Name: $VERSION_NAME"
          echo "Using Version Code: $VERSION_CODE"

          # Only inject version into real app modules (those using common-conventions-app).
          # Explicitly exclude non-app modules: pjsip is an Android library,
          # sdk/*, youpipe/extractor|ffmpeg, whatsapp-signal, tools/* are
          # java/android libraries or host tools — injecting versionCode would break them.
          # Also exclude .git and build caches.
          find . -mindepth 2 -name "build.gradle.kts" \
            -not -path "./.git/*" \
            -not -path "./.gradle/*" \
            -not -path "*/build/*" \
            -not -path "./library/*" \
            -not -path "./pjsip/*" \
            -not -path "./sdk/*" \
            -not -path "./tools/*" \
            -not -path "./whatsapp-signal/*" \
            -not -path "./youpipe/extractor/*" \
            -not -path "./watch/*" \
            -not -path "./build-logic/*" | while read -r file; do
            if grep -q "common-conventions-app" "$file"; then
              echo "Injecting version into $file"
              sed -i '/versionCode[[:space:]]*=[[:space:]]*/d' "$file"
              sed -i '/versionName[[:space:]]*=[[:space:]]*/d' "$file"
              sed -i "/defaultConfig[[:space:]]*{/a \        versionCode = $VERSION_CODE\n        versionName = \"$VERSION_NAME\"" "$file"
            else
              echo "Skipping non-app module: $file"
            fi
          done

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Detect App Modules
        run: |
          # App modules are identified by the common-conventions-app plugin,
          # not by the presence of versionCode.
          # Using find + grep is more robust than grep -r with exclude-dir on different platforms.
          RAW_DIRS=$(find . -name "build.gradle.kts" \
            -not -path "./.git/*" \
            -not -path "./.gradle/*" \
            -not -path "*/build/*" \
            -not -path "./build-logic/*" \
            -not -path "./library/*" \
            -not -path "./pjsip/*" \
            -not -path "./sdk/*" \
            -not -path "./tools/*" \
            -not -path "./whatsapp-signal/*" \
            -not -path "./youpipe/extractor/*" \
            -not -path "./watch/*" \
            -exec grep -l "common-conventions-app" {} \; | \
            sed 's|^\./||; s|/build.gradle.kts$||' | sort -u)

          echo "Detected app modules:"
          echo "$RAW_DIRS"

          REVERSED_DIRS=$(echo "$RAW_DIRS" | tac | tr '\n' ' ')
          echo "module_dirs=$REVERSED_DIRS" >> $GITHUB_ENV

      - name: Prepare F-Droid Metadata
        run: |
          # Play/F-Droid listing icons are generated here (only in CI) from each app's
          # launcherIcon symbol + ic_launcher_background, instead of committing a
          # per-app ic_launcher-playstore.png. Mirrors GenerateLauncherIconTask: the
          # outlined Material Symbol glyph (black), scaled within a solid background.
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick >/dev/null
          MATERIAL_SYMBOLS_REF="819d78680a849ceef4c78f863d8753e3160b7c89"
          DEFAULT_BG="#FFFFFF"

          for dir in ${{ env.module_dirs }}; do
            module_key=$(echo $dir | sed 's|/|-|g')
            target_path="$dir/src/main/play/listings/en-US"

            mkdir -p "$target_path/graphics/icon"
            mkdir -p "$target_path/graphics/phone-screenshots"

            # --- Generate the 512x512 Play Store icon ---
            symbol=$(grep -oE 'symbol[[:space:]]*=[[:space:]]*"[^"]+"' "$dir/build.gradle.kts" 2>/dev/null | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -n "$symbol" ]; then
              # NOTE: these end in `grep`, which exits non-zero when there is no
              # match. Under `bash -e` that would abort the whole step, so each is
              # made non-fatal with `|| true` and falls back to a default below.
              scale=$(grep -oE 'scale[[:space:]]*=[[:space:]]*[0-9.]+' "$dir/build.gradle.kts" 2>/dev/null | head -1 | grep -oE '[0-9.]+' || true)
              scale=${scale:-0.58}
              bg=$(grep -rhoE '<color name="ic_launcher_background">#[0-9A-Fa-f]+' "$dir/src/main/res" 2>/dev/null | head -1 | grep -oE '#[0-9A-Fa-f]+' || true)
              bg=${bg:-$DEFAULT_BG}
              glyph_px=$(awk "BEGIN{printf \"%d\", 512*$scale}")
              svg_url="https://raw.githubusercontent.com/google/material-design-icons/$MATERIAL_SYMBOLS_REF/symbols/web/$symbol/materialsymbolsoutlined/${symbol}_24px.svg"
              if curl -sf "$svg_url" -o /tmp/glyph.svg; then
                rsvg-convert -w "$glyph_px" -h "$glyph_px" /tmp/glyph.svg -o /tmp/glyph.png
                convert -size 512x512 "xc:$bg" /tmp/glyph.png -gravity center -composite "$target_path/graphics/icon/icon.png"
                echo "Generated icon for $dir ($symbol on $bg, scale $scale)"
              else
                echo "WARNING: could not fetch Material Symbol '$symbol' for $dir"
              fi
            else
              echo "WARNING: no launcherIcon symbol found for $dir"
            fi

            screenshot_dir="metadata_data/photos/${module_key}"
            screenshot_file="metadata_data/photos/${module_key}.png"
            if [ -d "$screenshot_dir" ]; then
              cp "$screenshot_dir"/*.png "$target_path/graphics/phone-screenshots/" 2>/dev/null || true
            elif [ -f "$screenshot_file" ]; then
              cp "$screenshot_file" "$target_path/graphics/phone-screenshots/1.png"
            fi

            metadata_src="metadata_data/${module_key}.md"
            if [ -f "$metadata_src" ]; then
              head -n 1 "$metadata_src" > "$target_path/short-description.txt"
              cp "$metadata_src" "$target_path/full-description.txt"
            fi

            # --- Generate title.txt with MA branding (except FindFamily) ---
            # Match app_name with any following attributes: most modules declare it as
            # <string name="app_name" translatable="false">, which a fixed '...app_name">'
            # pattern misses, silently falling through to the module-key fallback below.
            app_name=$(grep -m1 -E '<string name="app_name"[^>]*>' "$dir/src/main/res/values/strings.xml" 2>/dev/null | sed -E 's/.*<string name="app_name"[^>]*>(.*)<\/string>.*/\1/' | xargs)
            if [ -z "$app_name" ]; then
              # Fallback: derive from module_key
              app_name=$(echo "$module_key" | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) tolower(substr($i,2))}1')
            fi
            if [ "$module_key" = "findfamily" ]; then
              title="$app_name"
            else
              case "$app_name" in
                MA\ *) title="$app_name" ;;
                *) title="MA $app_name" ;;
              esac
            fi
            echo "$title" > "$target_path/title.txt"
            echo "Generated title.txt for $dir: $title"
          done

      - name: Local Git Commit and Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage only what the earlier steps write: the two root gradle files sed'd by
          # "Clean Project Files", the per-module build.gradle.kts version injection, and
          # the generated Play/F-Droid listings. Never `git add .` - that also picks up the
          # decoded keystore, which this commit is reachable from once the tag is pushed.
          git add -- settings.gradle.kts build.gradle.kts
          for dir in ${{ env.module_dirs }}; do
            git add -- "$dir/build.gradle.kts" "$dir/src/main/play/listings/en-US"
          done

          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          
          git commit -m "chore: prepare release $VERSION_NAME" || echo "No changes to commit"
          git tag "$VERSION_NAME"

      - name: Install Rust Toolchain 1.97.0
        run: |
          set -e
          TOOLCHAIN=$(grep -h 'channel =' rust-toolchain.toml | head -1 | cut -d'"' -f2)
          if [ -z "$TOOLCHAIN" ]; then
            echo "Error: could not read channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "Installing Rust toolchain $TOOLCHAIN + aarch64-linux-android"
          rustup toolchain install $TOOLCHAIN --no-self-update --profile minimal
          rustup target add aarch64-linux-android --toolchain $TOOLCHAIN
          rustup default $TOOLCHAIN
          rustc --version
          cargo --version
          rustup target list --installed --toolchain $TOOLCHAIN

      - name: Build and Sign APKs
        env:
          ks_store_pass: ${{ secrets.KS_STORE_PASS }}
          ks_alias: ${{ secrets.KS_ALIAS }}
          ks_alias_pass: ${{ secrets.KS_ALIAS_PASS }}
        run: |
          # Always build release APKs for every app module.
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -x lint \
            -x test \
            -Pandroid.enableResourceOptimizations=true \
            -Pandroid.enableR8.fullMode=true \
            -PRELEASE_STORE_FILE="${{ github.workspace }}/${{ env.ks_filename }}" \
            -PRELEASE_STORE_PASSWORD="$ks_store_pass" \
            -PRELEASE_KEY_ALIAS="$ks_alias" \
            -PRELEASE_KEY_PASSWORD="$ks_alias_pass"

          # Consolidate all generated APKs into one directory
          mkdir -p distribution_apks
          find . -path "*/build/outputs/apk/release/*.apk" -exec cp {} distribution_apks/ \;

          # Signing is done - get the key off disk before any third-party action runs.
          # The `if: always()` Cleanup Keystore step below stays as a backstop for the
          # case where the build fails before reaching this point.
          rm -f "${{ env.ks_filename }}"

      - name: Push Tag Only
        if: success()
        run: |
          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          git push origin "$VERSION_NAME"

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: "${{ steps.version_info.outputs.version_name }}"
          name: "Release ${{ steps.version_info.outputs.version_name }}"
          draft: true
          body: |
            Automated multi-module release.
            Version Name: ${{ steps.version_info.outputs.version_name }}
            Version Code: ${{ steps.version_info.outputs.version_code }}
          files: distribution_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Keystore
        if: always()
        run: rm -f ${{ env.ks_filename }}