name: "🔒 Cargo Deny"

# Automated dependency monitoring for the Rust side of the tree
# (SUPPLY_CHAIN_RISKS.md 6.4). Complements .github/dependabot.yml: Dependabot
# proposes upgrades, this reports advisories/bans/sources on what is committed.
#
# The schedule matters as much as the PR trigger - an advisory can land against
# an unchanged lockfile, which no pull_request run would ever catch.

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/cargo-deny.yml"
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/cargo-deny.yml"
  schedule:
    # Mondays 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

# Read-only. This workflow needs no secrets and writes nothing.
permissions:
  contents: read

concurrency:
  group: cargo-deny-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Single job on the repo-root workspace. The tree has exactly one tracked
    # Cargo.lock (see `git ls-files '*Cargo.lock*'`), and every crate under
    # code/, games/, library/ and scripts/maps/ is a member of that workspace
    # (no [workspace] table of its own, `workspace = true` inheritance) — so
    # one `cargo deny` run covers the whole tree. Do NOT reintroduce a matrix:
    # `personal/uniflix_strem` is a detached workspace of its own precisely so the
    # gitignored personal/ tree never affects this job (see the root Cargo.toml
    # `exclude`), and it is intentionally not monitored here.
    name: "cargo-deny (.)"

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny only reads Cargo.toml/Cargo.lock, it never compiles the
      # crates, so the runner's default toolchain is enough - the pinned
      # 1.97.0 android toolchain is not needed here.
      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny

      - name: Check advisories, bans and sources
        run: |
          cargo deny \
            --manifest-path ./Cargo.toml \
            --config deny.toml \
            check advisories bans sources

      # Separate step from the one above only so a licence failure is
      # attributable at a glance; it is equally blocking. The allow list in
      # deny.toml is the verified minimal set for the committed lockfiles, so a
      # failure here means a genuinely new licence arrived and needs a human
      # decision.
      - name: Check licenses
        run: |
          cargo deny \
            --manifest-path ./Cargo.toml \
            --config deny.toml \
            check licenses
