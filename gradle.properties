# Default daemon heap is sized for scoped work (:module: builds, lint, agents):
# small Xms so idle daemons are cheap and several can coexist without the OS
# killing them (a kill forces a full multi-minute reconfigure on next build).
# Full-repo builds (`./install all`, ~100 modules with concurrent D8 dex merge)
# OOM on this heap, so ./install auto-escalates with
# -Dorg.gradle.jvmargs=<46g big-build heap> + --max-workers=32 when — and only
# when — the `all` keyword is expanded (a separate big daemon; the small one
# stays alive). Do not raise the default here — override locally in
# ~/.gradle/gradle.properties instead (same mechanism CI uses).
#
# MaxMetaspaceSize=1024m: the previous 512m cap was killing the daemon on
# release builds (R8 fullMode + lintVitalRelease + KSP + Kotlin compile all
# load class metadata into the same daemon's metaspace; with parallel workers we
# easily blew past 512m).
org.gradle.jvmargs=-Xmx8g -Xms512m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx1536m

# Cap parallel workers so concurrent D8/Kotlin workers fit in the default heap.
# ./install raises this for full builds.
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true

# Modern defaults
kotlin.code.style=official

# Performance & Optimization
org.gradle.configuration-cache=true
android.enableR8.fullMode=true
# One thread per R8 task (each runs in its own process, see settings.gradle.kts):
# multi-threaded R8 output depends on thread timing, which broke F-Droid's
# byte-for-byte reproducibility. Release builds parallelize across apps instead
# (android.r8.maxWorkers).
android.r8.threadPoolSize=1

# Preview Support (Remove once SDK 37 is stable)
android.suppressUnsupportedCompileSdk=37.0

# Compose Preview Screenshot Testing, used by common-conventions-preview-metadata to render
# store listing images from @Preview instead of from an instrumented test on a device.
# It has to live here rather than in the android {} block: the plugin reads it when it is
# applied, which is before any DSL has been configured. Modules that don't apply the plugin
# just get an empty screenshotTest source set, which costs nothing.
android.experimental.enableScreenshotTest=true

# Preview rendering is host-side and holds whole bitmaps in memory; the listing images are
# full-screen at xxhdpi (~1080x2340), so the default test-JVM heap is not enough.
android.compose.screenshot.maxHeapSize=4g

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
