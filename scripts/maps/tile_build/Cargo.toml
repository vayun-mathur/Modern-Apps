# Host-side vector-tile build tools for the Maps basemap.
#
# Replaces `tippecanoe` and `tile-join`, which have no Windows path, so the whole
# tile chain is cargo-only and `build_graph.ps1` can drive it from one command.
#
# Deliberately DETACHED from the Android Rust workspace (the empty [workspace]
# table below), exactly like `scripts/maps/gtfs_ingest` and
# `scripts/maps/osm_ingest`: it is a host binary, so `cargo build` here never
# pulls the aarch64-android toolchain or the app crates' lints.
#
# Both dependencies are pure Rust and no C toolchain is involved:
#
#   miniz_oxide  inflate AND deflate. Unlike osm_ingest, this crate needs the
#                DEFLATE side too -- PMTiles gzips both its directories and its
#                tiles, so we compress as well as decompress.
#   rayon        the tilers' work-stealing pool. Level-9 DEFLATE inside
#                `pyramid::fit_tile` is where a layer build spends ~90% of its
#                wall clock, and it is per-tile pure, so it threads.
#
# `cargo build --offline` resolves both from the local registry cache, along with
# rayon's own tree (rayon-core, crossbeam-deque, crossbeam-utils, crossbeam-epoch,
# either). That is a statement about THIS box's cache, not a guarantee: a clean
# machine needs one online `cargo fetch` before it can build offline.
[package]
name = "tile_build"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only"
description = "MVT + PMTiles v3 reader/writer for the Maps basemap (replaces tippecanoe/tile-join)"
[lib]
name = "tile_build"
path = "src/lib.rs"
[[bin]]
name = "mamaps_dump"
path = "src/bin/mamaps_dump.rs"
[[bin]]
name = "mamaps_pack"
path = "src/bin/mamaps_pack.rs"
[[bin]]
name = "transit_planet5"
path = "src/bin/transit_planet5.rs"
[[bin]]
name = "mamaps_planet5"
path = "src/bin/mamaps_planet5.rs"
[[bin]]
name = "mamaps_churn"
path = "src/bin/mamaps_churn.rs"
[[bin]]
name = "mamaps_overlay"
path = "src/bin/mamaps_overlay.rs"
[dependencies]
# The PMTiles + MVT codec, shared with the Android renderer in `:library:map`.
# Member of the repo-root workspace; path + `write` feature select the writer.
tilecodec = { workspace = true, features = ["write"] }
miniz_oxide.workspace = true
rayon.workspace = true
sha2.workspace = true
# Anonymous pagefile-backed mappings for the spill backends (see `anon`): already
# in the tree via osm_ingest, so this adds a name to link, not a crate to fetch.
memmap2.workspace = true
# Planet5 transcoder (`mamaps_planet5`): the pure-Rust zstd encoder with dictionaries (what the
# reader's `ruzstd` decodes), and the C zstd dictionary trainer -- host-only, never in the
# Android cdylib (tilecodec's reader keeps its single pure-Rust decoder). Both were already in
# the workspace's lockfile.
zstd-rs.workspace = true
zstd.workspace = true
[profile.release]
opt-level = 3

# Size-lab experiment (examples/size_lab.rs) only: the C zstd reference
# encoder + dictionary trainer, and the two pure-Rust codecs the shipping
# path uses (zstd-rs encode, ruzstd decode), measured side by side. Never
# linked into the shipping binaries.
[dev-dependencies]
ruzstd.workspace = true
png.workspace = true
