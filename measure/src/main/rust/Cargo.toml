[package]
name = "measure_cv"
version = "0.1.0"
edition = "2021"
description = "Per-frame computer vision for the measure app's visual-inertial tracker: Shi-Tomasi corners, pyramidal Lucas-Kanade tracking and essential-matrix pose recovery, via JNI. Geometry above the correspondences (triangulation, plane fit, IMU scale) stays in Kotlin."
license = "GPL-2.0-only"

[lib]
name = "measure_cv"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
# Shared CV primitives. Default features only: no JPEG codec, since frames arrive
# as raw camera luminance planes.
vision_core = { path = "../../../../library/vision/src/main/rust" }
