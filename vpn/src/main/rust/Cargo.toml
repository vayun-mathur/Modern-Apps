[package]
name = "vpn_wireguard"
version = "0.1.0"
edition = "2021"
description = "WireGuard VPN tunnel implementation based on Mullvad's gotatun (BoringTun fork)"
license = "MPL-2.0"

[lib]
name = "vpn_wireguard"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
base64 = "0.22.1"
x25519-dalek = { version = "2.0.1", features = ["reusable_secrets", "static_secrets", "getrandom"] }
aead = "0.5.2"
chacha20poly1305 = "0.10.1"
blake2 = "0.11.0"
hmac = "0.12.1"
rand.workspace = true
rand_core.workspace = true
getrandom.workspace = true
bytes = "1.11.0"
parking_lot = "0.12.5"
zerocopy = { version = "0.8.27", features = ["derive", "std"] }
constant_time_eq = "0.4.2"
typed-builder = "0.21.0"
bitfield-struct = "0.12.1"
either = "1.15.0"
libc.workspace = true
hex = "0.4.3"
duplicate = "2.0.0"
eyre = "0.6.12"
tracing = { version = "0.1.40", default-features = false, features = ["std"] }
thiserror.workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
