# Gradle profile for the agent sandbox (6 vCPU / 14 GB container cap).
# builder-init copies this file to /gradle-cache/gradle.properties on first
# boot. Smaller than the release profile (4 workers / 12 GB heap) because the
# sandbox shares the box with the live server.
org.gradle.jvmargs=-Xmx6g -Xms512m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.workers.max=5
kotlin.daemon.jvm.options=-Xmx1536m
org.gradle.daemon.idletimeout=1800000
